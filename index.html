```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMN AI</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
--bg:#070708;
--surface:#111114;
--surface2:#18181d;
--border:rgba(255,255,255,0.08);

--umn-red:#c1121f;
--umn-red2:#ff4d5a;

--umn-green:#0b7a43;
--umn-melon:#ff7f50;

--text:#f1f1f4;
--muted:#8d8da8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'DM Sans',sans-serif;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
background:
radial-gradient(circle at top left, rgba(193,18,31,.18), transparent 30%),
radial-gradient(circle at bottom right, rgba(11,122,67,.18), transparent 30%),
var(--bg);

color:var(--text);
}

/* GRID BACKGROUND */

body::before{
content:'';
position:fixed;
inset:0;

background-image:
linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

background-size:40px 40px;
pointer-events:none;
}

/* HEADER */

header{
position:relative;
z-index:10;

display:flex;
align-items:center;
justify-content:space-between;

padding:14px 20px;

background:rgba(0,0,0,0.45);

backdrop-filter:blur(20px);

border-bottom:1px solid var(--border);
}

.logo{
display:flex;
align-items:center;
gap:12px;

font-family:'Space Mono',monospace;
font-size:22px;
font-weight:700;
letter-spacing:2px;

background:linear-gradient(
90deg,
var(--umn-red2),
var(--umn-melon),
#ffffff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.logo-dot{
width:12px;
height:12px;
border-radius:50%;

background:linear-gradient(
135deg,
var(--umn-red2),
var(--umn-green)
);

box-shadow:
0 0 15px var(--umn-red2),
0 0 25px var(--umn-green);
}

.header-badge{
padding:6px 12px;
border-radius:999px;

font-family:'Space Mono',monospace;
font-size:11px;

border:1px solid rgba(255,255,255,0.08);

background:rgba(255,255,255,0.03);

display:flex;
align-items:center;
gap:8px;
}

.status{
width:8px;
height:8px;
border-radius:50%;

background:var(--umn-green);

box-shadow:0 0 12px var(--umn-green);

animation:pulse 2s infinite;
}

@keyframes pulse{
0%,100%{
opacity:1;
transform:scale(1);
}
50%{
opacity:.5;
transform:scale(.8);
}
}

/* CHAT */

#chat{
flex:1;
overflow-y:auto;

padding:24px 18px;

display:flex;
flex-direction:column;
gap:18px;

scroll-behavior:smooth;
}

#chat::-webkit-scrollbar{
width:5px;
}

#chat::-webkit-scrollbar-thumb{
background:rgba(255,255,255,0.08);
border-radius:999px;
}

/* WELCOME */

#welcome{
margin:auto;
text-align:center;
max-width:760px;
}

#welcome h1{
font-family:'Space Mono',monospace;
font-size:clamp(32px,5vw,60px);
line-height:1.1;

background:
linear-gradient(
135deg,
var(--umn-red2),
var(--umn-melon),
#ffffff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

margin-bottom:18px;
}

#welcome p{
color:var(--muted);
font-size:16px;
line-height:1.7;
margin-bottom:30px;
}

.umni{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

.tag{
padding:10px 16px;
border-radius:999px;

background:rgba(255,255,255,0.04);

border:1px solid rgba(255,255,255,0.07);

font-size:13px;

transition:.2s;
}

.tag:hover{
transform:translateY(-2px);

border-color:rgba(255,127,80,.5);

background:rgba(255,127,80,.08);
}

/* MESSAGE */

.msg-wrap{
display:flex;
gap:12px;
max-width:950px;
width:100%;
}

.msg-wrap.user{
margin-left:auto;
flex-direction:row-reverse;
}

.avatar{
width:38px;
height:38px;
border-radius:12px;

display:flex;
align-items:center;
justify-content:center;

font-family:'Space Mono',monospace;
font-size:11px;
font-weight:700;

flex-shrink:0;
}

.ai-av{
background:
linear-gradient(
135deg,
var(--umn-red),
var(--umn-green)
);

box-shadow:
0 0 20px rgba(193,18,31,.25);
}

.user-av{
background:var(--surface2);
border:1px solid var(--border);
color:var(--muted);
}

.msg{
padding:15px 18px;
border-radius:18px;

line-height:1.75;
font-size:15px;

max-width:720px;
word-wrap:break-word;
}

.msg.user{
background:
linear-gradient(
135deg,
rgba(255,127,80,.12),
rgba(193,18,31,.12)
);

border:1px solid rgba(255,127,80,.18);

border-bottom-right-radius:6px;
}

.msg.ai{
background:rgba(17,17,20,.88);

border:1px solid rgba(255,255,255,0.06);

backdrop-filter:blur(20px);

border-bottom-left-radius:6px;

box-shadow:
0 10px 40px rgba(0,0,0,.35);
}

/* INPUT */

#bottom{
padding:16px;

background:rgba(0,0,0,.55);

border-top:1px solid rgba(255,255,255,.05);

backdrop-filter:blur(20px);
}

#apiKey{
width:100%;

padding:13px 14px;

border-radius:14px;

background:rgba(255,255,255,0.03);

border:1px solid rgba(255,255,255,0.07);

color:white;

outline:none;

margin-bottom:12px;
}

#apiKey:focus{
border-color:rgba(255,127,80,.4);
}

#input-box{
display:flex;
align-items:flex-end;
gap:10px;

padding:10px 12px;

border-radius:18px;

background:rgba(255,255,255,0.03);

border:1px solid rgba(255,255,255,0.07);
}

textarea{
flex:1;

background:transparent;
border:none;
outline:none;

resize:none;

font-family:'DM Sans',sans-serif;
font-size:15px;
line-height:1.6;

color:white;

max-height:180px;
}

textarea::placeholder,
#apiKey::placeholder{
color:#8f8fa9;
}

#sendBtn{
width:44px;
height:44px;

border:none;
border-radius:14px;

cursor:pointer;

font-size:18px;
font-weight:700;

color:white;

background:
linear-gradient(
135deg,
var(--umn-red2),
var(--umn-melon),
var(--umn-green)
);

box-shadow:
0 0 20px rgba(255,127,80,.25);
}

#sendBtn:hover{
transform:scale(1.03);
}

.footer{
text-align:center;
font-size:11px;
color:var(--muted);
margin-top:10px;
font-family:'Space Mono',monospace;
}

/* MOBILE */

@media(max-width:700px){

#welcome h1{
font-size:42px;
}

.msg{
max-width:100%;
}

header{
padding:12px 16px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
<div class="logo-dot"></div>
UMN AI
</div>

<div class="header-badge">
<div class="status"></div>
UNITED MELON NATIONS
</div>

</header>

<div id="chat">

<div id="welcome">

<h1>UNITED MELON NATIONS</h1>

<p>
Advanced UMN intelligence system powered by Groq.
Ask about science, coding, history, maths, ideas, worldbuilding and more.
</p>

<div class="umni">

<div class="tag">🍉 Melon Intelligence</div>
<div class="tag">⚔️ UMN Systems</div>
<div class="tag">🧠 AI Knowledge</div>
<div class="tag">🌍 Nation Network</div>

</div>

</div>

</div>

<div id="bottom">

<input
id="apiKey"
type="password"
placeholder="Enter Groq API Key..."
>

<div id="input-box">

<textarea
id="prompt"
rows="1"
placeholder="Message UMN AI..."
></textarea>

<button id="sendBtn">➜</button>

</div>

<div class="footer">
UNITY • GROWTH • STRENGTH
</div>

</div>

<script>

const chat = document.getElementById("chat");
const textarea = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");

function addMessage(role,text){

document.getElementById("welcome")?.remove();

const wrap = document.createElement("div");

wrap.className =
role === "user"
? "msg-wrap user"
: "msg-wrap";

wrap.innerHTML = `
<div class="avatar ${role==="user"?"user-av":"ai-av"}">
${role==="user"?"YOU":"UMN"}
</div>

<div class="msg ${role}">
${text}
</div>
`;

chat.appendChild(wrap);

chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(){

const key =
document.getElementById("apiKey").value.trim();

const text = textarea.value.trim();

if(!key){
alert("Enter Groq API key");
return;
}

if(!text) return;

addMessage("user",text);

textarea.value = "";

try{

const response = await fetch(
"https://api.groq.com/openai/v1/chat/completions",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + key
},

body:JSON.stringify({

model:"llama-3.1-8b-instant",

messages:[
{
role:"system",
content:"You are UMN AI, the official AI of the United Melon Nations."
},
{
role:"user",
content:text
}
],

temperature:0.7

})
}
);

const data = await response.json();

const reply =
data.choices?.[0]?.message?.content
|| "No response.";

addMessage("ai",reply);

}catch(err){

addMessage(
"ai",
"Error: " + err.message
);

}

}

sendBtn.onclick = sendMessage;

textarea.addEventListener("keydown",e=>{

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

sendMessage();

}

});

</script>

</body>
</html>
